[per_case]
# PLAN §4: at most 12 agent steps and 40k tokens per case.
max_steps = 12
max_tokens = 40000

[pace]
# TASKS Q4: 2 concurrent requests, 30 per minute.
max_concurrent = 2
per_minute = 30

[retry]
# Transport errors and 429 only; a bad answer is never retried.
max_attempts = 3
base_delay_seconds = 0.5
max_delay_seconds = 8.0
max_retry_after_seconds = 300.0

[request]
temperature = 0.0
# DeepSeek V4.1 Flash is a reasoning model and its reasoning tokens count
# against this allowance. 1024 tokens were entirely consumed by reasoning on
# the first Q9 case, so Q9 raised the allowance (PLAN §3 says "at least 1,024")
# and pinned the reasoning effort to the documented "low" setting.
max_tokens = 8192
reasoning_effort = "low"
timeout_seconds = 60.0
