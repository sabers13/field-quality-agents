# Keyword rules for the linear "before" pipeline.
#
# This file is the whole rule set: no model, prompt or learned weight appears
# here. `fqa baseline` reads it, sorts each incoming report to one component
# group, and raises a safety flag. It was committed before any model result
# existed in the repository (see git log for config/keywords.toml).
#
# Matching is deterministic:
#
#   1. Lower-case both the component text and the narrative.
#   2. Split into alphanumeric tokens; a keyword phrase matches only as a
#      contiguous run of whole tokens (so "abs" does not match "absolutely").
#   3. A hit in the component text counts three times the phrase length; a hit
#      in the narrative counts once. The group with the highest score wins.
#   4. Ties go to the earlier group in this file, so the more specific groups
#      are listed first.
#   5. `fallback` is tried only when no other group matches. It keeps generic
#      "electrical system" reports from outranking a specific group.
#   6. No match at all sorts to `unclear`, which counts as wrong in macro-F1.
#
# The vocabulary is deliberately a readable rule of thumb, not a copy of the
# NHTSA component prefixes: the baseline is meant to look like a keyword sort a
# small team would actually write, including its gaps.

version = "v1"
unclear = "unclear"
fallback = "electrical_general"

# Safety flag: any hit routes the case to priority before the standard test.
# The flag is intentionally broad; PLAN §7 reports its precision and recall
# against the crash/fire/injury/death fields rather than assuming it is right.
[safety]
keywords = [
  "crash",
  "crashed",
  "crashing",
  "accident",
  "collision",
  "collided",
  "struck",
  "fire",
  "caught fire",
  "on fire",
  "electrical fire",
  "battery fire",
  "smoke",
  "smoking",
  "burning",
  "burned",
  "burnt",
  "melted",
  "melting",
  "explosion",
  "exploded",
  "thermal runaway",
  "injury",
  "injured",
  "hurt",
  "death",
  "died",
  "fatal",
  "fatality",
  "hospital",
  "medical attention",
  "airbag deployed",
  "air bag deployed",
  "lost control",
