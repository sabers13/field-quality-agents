[peak]
# Gateway pricing: peak is 01:00-04:00 and 06:00-10:00 UTC, Monday-Friday.
weekdays = ["mon", "tue", "wed", "thu", "fri"]
windows_utc = ["01:00-04:00", "06:00-10:00"]

[models."deepseek-v4.1-flash"]
input_per_million = 0.15
output_per_million = 0.60
cached_input_per_million = 0.003
peak_multiplier = 2.0

# Fallback for a model id missing from this file; recorded costs stay auditable.
[models.default]
input_per_million = 0.15
output_per_million = 0.60
cached_input_per_million = 0.003
peak_multiplier = 2.0
