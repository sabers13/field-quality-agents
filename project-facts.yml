# Canonical project facts.
#
# Every number the README quotes, and every number on the dashboard, is copied
# from here. Each entry names the committed file under `results/` it comes
# from, and `scripts/check_facts.py` re-derives the value from that file. A
# `display` string is the exact text the README must contain, so a number
# cannot drift away from its source without `make facts` failing.
#
# `before_source` / `after_source` use the form `path/to/file.json#dotted.path`.
# `scale` converts a source unit before rounding, and `display` in a headline
# entry is the number of decimal places used in README and on the dashboard.

schema: 1

project:
  name: Field Quality Agents
  version: 0.1.0
  licence: MIT
  model: DeepSeek V4.1 Flash
  tagline: >-
    The same returns pipeline, run twice: once linear, once with agents doing
    the legwork and engineers approving.
  question: >-
    What happens when a returns pipeline becomes agentic: same process, agents
    doing the legwork between the steps, engineers approving?

run:
  id: live-2025
  replay_id: replay
  set: replay_2025
  mode: record
  model: deepseek-v4.1-flash
  prompt_version: p1
  recording_digest: "69350c43bd033816"
  source: results/runs/live-2025/manifest.json
  replay_source: results/runs/replay/manifest.json

