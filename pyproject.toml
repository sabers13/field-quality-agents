[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "field-quality-agents"
version = "0.1.0"
description = "Agentic and linear returns pipelines on public field-quality data"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Saber Sojudi" }]
dependencies = [
  "duckdb==2.0.0",
  "fastapi>=0.115",
  "httpx>=0.28,<1",
  "langchain-core>=1.7,<2",
  "langgraph==1.2.19",
  "mcp==2.3.0",
  "pydantic>=2.11,<3",
  "scikit-learn>=1.9.1",
  "uvicorn>=0.30",
]

[project.scripts]
fqa = "field_quality_agents.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pyyaml>=6.0",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/field_quality_agents"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["field_quality_agents"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# scikit-learn does not ship type information; the reference model is isolated
# in baseline/tfidf.py and its public returns are annotated by hand.
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
