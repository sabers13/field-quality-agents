[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "field-quality-agents"
version = "0.1.0"
description = "Agentic and linear returns pipelines on public field-quality data"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Saber Sojudi" }]
dependencies = [
  "pydantic>=2.11,<3",
]

[project.scripts]
fqa = "field_quality_agents.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/field_quality_agents"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["field_quality_agents"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
