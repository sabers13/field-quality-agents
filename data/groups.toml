# Electrical/electronic component groups for the NHTSA selection.
#
# Q1 built this list from the component-description value counts in the
# October 2026 snapshot (complaints 2020-2024 and 2025-2026, recalls since
# 2010, investigations). A component maps to the group with the longest
# matching prefix; unmatched components do not belong to a group.
#
# The selection keeps a complaint only when every one of its component rows
# maps to the same group. Ten groups keeps the thin categories merged:
# starting, charging, ignition and wiring live together in power_and_wiring.

[[group]]
id = "adas"
description = "Driver-assistance electronics: collision avoidance, adaptive cruise, lane keeping and rear backup systems."
prefixes = [
  "FORWARD COLLISION AVOIDANCE",
  "LANE DEPARTURE",
  "BACK OVER PREVENTION",
  "ELECTRICAL SYSTEM:ADAS",
  "VEHICLE SPEED CONTROL:CRUISE CONTROL",
]

[[group]]
id = "restraints"
description = "Airbag and seat-belt restraint electronics, inflators, sensors and pretensioners."
prefixes = [
  "AIR BAGS",
  "SEAT BELTS",
]

[[group]]
id = "power_and_wiring"
description = "Power supply and distribution: 12/24/48 V batteries, alternators, starters, ignition and wiring harnesses."
prefixes = [
  "ELECTRICAL SYSTEM:12V/24V/48V BATTERY",
  "ELECTRICAL SYSTEM:ALTERNATOR",
  "ELECTRICAL SYSTEM:STARTER",
  "ELECTRICAL SYSTEM:IGNITION",
  "ELECTRICAL SYSTEM:MOTORCYCLE STARTER",
  "ELECTRICAL SYSTEM:WIRING",
]

[[group]]
id = "ev_propulsion"
description = "Electric and hybrid propulsion: traction batteries, drive units, inverters, charging and fuel cells."
prefixes = [
  "ELECTRICAL SYSTEM:PROPULSION SYSTEM",
  "HYBRID PROPULSION SYSTEM",
  "ELECTRIC PROPULSION",
  "FUEL CELL",
]

[[group]]
id = "instrumentation"
description = "Instrument clusters, gauges, odometers and driver warning displays."
prefixes = [
  "ELECTRICAL SYSTEM:INSTRUMENT",
  "INSTRUMENT CLUSTER",
  "INSTRUMENT PANEL",
]

[[group]]
id = "infotainment"
description = "Infotainment, radio, navigation, telematics and over-the-air software."
prefixes = [
  "EQUIPMENT:ELECTRICAL:INFOTAINMENT",
  "EQUIPMENT:ELECTRICAL:RADIO",
  "EQUIPMENT:ELECTRICAL:NAVIGATIONAL",
  "EQUIPMENT:APPLIANCE:TV/RADIO/SPEAKERS",
  "COMMUNICATION",
  "ELECTRICAL SYSTEM:SOFTWARE",
]

[[group]]
id = "lighting"
description = "Exterior and interior lighting: headlights, tail lights, brake lights, turn signals and lamps."
prefixes = [
  "EXTERIOR LIGHTING",
  "INTERIOR LIGHTING",
  "ELECTRICAL SYSTEM:INTERIOR LAMPS",
]

[[group]]
id = "body_controls"
description = "Body electronics: control modules, locks, windows, mirrors, wipers, horns and seat heaters."
prefixes = [
  "ELECTRICAL SYSTEM:BODY CONTROL MODULE",
  "ELECTRICAL SYSTEM:HORN",
  "ELECTRICAL SYSTEM:HAND HEATER",
  "ELECTRICAL SYSTEM:SEAT HEATER",
  "LATCHES/LOCKS/LINKAGES:ELECTRONIC",
  "VISIBILITY:POWER WINDOW",
  "VISIBILITY:REARVIEW MIRRORS",
  "VISIBILITY:REAR WINDOW WIPER",
  "VISIBILITY:WINDSHIELD WIPER",
  "VISIBILITY:SUN/MOON ROOF",
  "VISIBILITY:FIXED PANARAMIC ROOF",
  "VISIBILITY/WIPER",
]

[[group]]
id = "safety_systems"
description = "Electronic safety systems: stability and traction control, antilock brakes, electric parking brakes and tyre pressure monitoring."
prefixes = [
  "ELECTRONIC STABILITY CONTROL",
  "TRACTION CONTROL SYSTEM",
  "SERVICE BRAKES, HYDRAULIC:ANTILOCK",
  "SERVICE BRAKES, AIR:ANTILOCK",
  "SERVICE BRAKES, ELECTRIC",
  "PARKING BRAKE:ELECTRICAL",
  "TIRES:PRESSURE MONITORING",
  "ELECTRICAL SYSTEM:INTEGRATED TRAILER BRAKE",
]

[[group]]
id = "electrical_general"
description = "Electrical system complaints not covered by a more specific group."
prefixes = [
  "ELECTRICAL SYSTEM",
]
